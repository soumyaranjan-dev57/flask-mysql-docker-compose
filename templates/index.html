<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask + MySQL Messages</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f4f7fb;
            color: #222;
        }
        h1 { color: #2457a7; }
        form { display: flex; gap: 10px; margin-bottom: 25px; }
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            padding: 12px 18px;
            background: #2457a7;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }
        li {
            background: white;
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 6px;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
    <h1>Flask + MySQL Messages</h1>
    <p>A simple two-tier application running with Docker Compose.</p>

    <form action="/submit" method="post">
        <input
            type="text"
            name="message"
            maxlength="255"
            placeholder="Write a message..."
            required
        >
        <button type="submit">Save Message</button>
    </form>

    <h2>Saved Messages</h2>
    <ul>
        {% for item in messages %}
            <li>{{ item.message }} <small>— {{ item.created_at }}</small></li>
        {% else %}
            <li>No messages yet. Add the first one!</li>
        {% endfor %}
    </ul>
</body>
</html>
